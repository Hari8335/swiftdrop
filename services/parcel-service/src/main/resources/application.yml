spring:
  application:
    name: parcel-service
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

swiftdrop:
  security:
    internal:
      tokens:
        pricing-service: ${INTERNAL_PRICING_SERVICE_TOKEN:swiftdrop-internal-pricing-secret-2026}
        courier-directory: ${INTERNAL_COURIER_DIRECTORY_TOKEN:swiftdrop-internal-courier-secret-2026}
  couriers:
    # operations-service internal courier directory (driver assignment history). When empty it is
    # derived from swiftdrop.pricing.quote-url, which already points at operations-service in Docker.
    directory-url: ${SWIFTDROP_COURIERS_DIRECTORY_URL:}
